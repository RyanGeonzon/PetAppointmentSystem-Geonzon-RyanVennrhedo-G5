<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PawCare{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#667085;--brand:#3b5bdb;--ok:#e6f6ec;--okt:#157f3b;--err:#fdecec;--errt:#b42318;--line:#e4e7ec}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--text:#e8ebf2;--muted:#9aa3b5;--brand:#7c93ff;--ok:#12301f;--okt:#6ee7a0;--err:#3a1717;--errt:#ff9b94;--line:#2b3247}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
nav{display:flex;gap:1rem;align-items:center;padding:.8rem 1.5rem;background:var(--card);border-bottom:1px solid var(--line)}
nav .brand{font-weight:700;margin-right:auto}nav a,nav button{color:var(--brand);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}
main{max-width:760px;margin:2rem auto;padding:0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.msg{padding:.7rem 1rem;border-radius:8px;margin-bottom:.8rem}.msg.success{background:var(--ok);color:var(--okt)}.msg.error{background:var(--err);color:var(--errt)}
label{display:block;font-weight:600;margin-top:.9rem}input{width:100%;padding:.6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.btn{display:inline-block;margin-top:1.2rem;padding:.6rem 1.2rem;background:var(--brand);color:#fff;border:0;border-radius:8px;cursor:pointer;text-decoration:none;font:inherit}
nav .btn{margin:0;color:#fff}.err{color:var(--errt);font-size:.88rem;margin:.25rem 0 0}.help{color:var(--muted);font-size:.8rem}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.5rem;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:1rem}.stats .card{flex:1;margin:0}.stats b{font-size:1.8rem;display:block}
img.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover}
</style>
</head>
<body>
<nav>
  <span class="brand">PawCare</span>
  {% if user.is_authenticated %}
    {% if user.role == "admin" %}<a href="{% url 'accounts:admin_dashboard' %}">Admin Dashboard</a>
    {% else %}<a href="{% url 'accounts:owner_dashboard' %}">My Pets &amp; Appointments</a>{% endif %}
    <a href="{% url 'accounts:profile' %}">Profile</a>
    <form method="post" action="{% url 'accounts:logout' %}" style="margin:0">{% csrf_token %}<button type="submit">Log out</button></form>
  {% else %}
    <a href="{% url 'accounts:login' %}">Log in</a><a class="btn" href="{% url 'accounts:register' %}">Register</a>
  {% endif %}
</nav>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body></html>
