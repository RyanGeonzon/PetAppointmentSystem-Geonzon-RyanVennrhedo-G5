{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card"><h2>Create an account</h2>
<form method="post" novalidate>{% csrf_token %}{% include "accounts/_form.html" %}
<button class="btn" type="submit">Register</button></form>
<p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p></div>
{% endblock %}
